name: SuperFW release
run-name: Build a full SuperFW release

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'carousel'
    tags:
      - '*'

jobs:
  build-firmware:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        board: [sd, lite, chis]

    steps:
      - name: Install dependencies
        run: sudo apt-get install gcc-arm-none-eabi
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Get short SHA
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT
      - name: Arrange files
        run: |
          cp res/patches.db patches.db
      - name: Build firmware
        run: |
          make BOARD=${{ matrix.board }} clean
          make BOARD=${{ matrix.board }} COMPRESSION_RATIO=10
          mv superfw.gba superfw-${{ matrix.board }}.fw
          cp superfw.dldi.payload superfw-${{ matrix.board }}.dldi
      - name: Upload firmware release
        uses: actions/upload-artifact@v7
        with:
          name: superfw-release-${{ matrix.board }}-${{ steps.slug.outputs.sha8 }}
          path: |
            superfw-${{ matrix.board }}.fw
      - name: Upload debug artifacts
        uses: actions/upload-artifact@v7
        with:
          name: superfw-debug-${{ matrix.board }}-${{ steps.slug.outputs.sha8 }}
          path: |
            superfw-${{ matrix.board }}.fw
            directsave.elf
            firmware.elf
            firmware.ewram.elf
            ingamemenu.elf
            superfw.dldi.elf
      - name: Upload extra artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: superfw-dev-${{ matrix.board }}-${{ steps.slug.outputs.sha8 }}
          path: |
            superfw-${{ matrix.board }}.fw
            superfw-${{ matrix.board }}.dldi
            patches.db

  # Fork releases (tags v<upstream>-carousel.<n>) also ship the cover maker.
  cover-tool:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/make-covers.yml
    secrets: inherit
    permissions:
      contents: write

  release:
    needs: [build-firmware, cover-tool]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
      - uses: actions/download-artifact@v7
        with:
          pattern: 'superfw-release-*'
          path: artifacts
      - uses: actions/download-artifact@v7
        with:
          pattern: 'make-covers-*'
          path: covers
      - name: Create release and upload firmware
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p files
          cp artifacts/*/*.fw files/
          for n in windows macos linux; do cp covers/make-covers-$n/* files/; done
          (cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Notes: this version's section of CHANGELOG.md, else the tag message.
          awk -v t="## $TAG" '$0 == t {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$TAG" > notes.md
          fi
          echo >> notes.md
          echo "[Code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy) of the cover maker" >> notes.md
          gh release create "$TAG" --title "SuperFW $TAG" --notes-file notes.md files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

